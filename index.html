<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="墨刻 Markdown：支持实时预览与 LaTeX 公式的在线写作工具。"
    />
    <meta name="theme-color" content="#f5f1e8" />
    <link rel="icon" type="image/png" href="./assets/favicon.png" />
    <title>墨刻 Markdown</title>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand">
          <a
            class="brand-logo-link"
            href="https://harleyblog.cn"
            aria-label="访问 Harley Blog"
          >
            <span class="brand-logo" aria-hidden="true">
              <img src="./assets/harley-logo.png" alt="" />
            </span>
          </a>
          <span class="brand-name">墨刻</span>
          <span class="brand-divider" aria-hidden="true"></span>
          <span class="brand-product">Markdown</span>
        </div>

        <nav
          class="view-switcher"
          aria-label="视图模式"
          data-i18n-aria-label="viewMode"
        >
          <button
            type="button"
            data-mode="edit"
            aria-pressed="false"
            data-i18n="editOnly"
          >
            仅编辑
          </button>
          <button
            type="button"
            data-mode="split"
            aria-pressed="true"
            data-i18n="splitView"
          >
            分栏
          </button>
          <button
            type="button"
            data-mode="preview"
            aria-pressed="false"
            data-i18n="previewOnly"
          >
            仅预览
          </button>
        </nav>

        <div class="topbar-actions">
          <button class="new-document" id="new-document" type="button">
            <i data-lucide="file-plus-2" aria-hidden="true"></i>
            <span data-i18n="newDocument">新建文稿</span>
          </button>
          <div
            class="language-switcher"
            role="group"
            aria-label="界面语言"
            data-i18n-aria-label="language"
          >
            <button type="button" data-language="zh-CN" aria-pressed="true">
              中
            </button>
            <button type="button" data-language="en" aria-pressed="false">
              EN
            </button>
          </div>
          <button
            class="icon-button"
            id="theme-button"
            type="button"
            aria-label="切换到深色主题"
            data-i18n-aria-label="switchToDark"
            data-tooltip="切换主题"
            data-i18n-tooltip="switchTheme"
          >
            <i data-lucide="moon" aria-hidden="true"></i>
          </button>
          <a
            class="icon-button"
            id="github-link"
            href="https://github.com/"
            target="_blank"
            rel="noreferrer noopener"
            aria-label="打开 GitHub 仓库"
            data-i18n-aria-label="openGithub"
            data-tooltip="GitHub"
          >
            <i data-lucide="git-fork" aria-hidden="true"></i>
          </a>
          <div class="save-state" id="save-state" aria-live="polite">
            <span class="save-dot" aria-hidden="true"></span>
            <span data-i18n="saved">已自动保存</span>
          </div>
        </div>
      </header>

      <main class="workspace" id="workspace" data-mode="split">
        <section
          class="pane editor-pane"
          aria-label="Markdown 编辑区"
          data-i18n-aria-label="editorArea"
        >
          <div class="pane-header">
            <div class="pane-title">
              <i data-lucide="pencil-line" aria-hidden="true"></i>
              <span data-i18n="editor">编辑器</span>
            </div>
            <div
              class="toolbar"
              id="toolbar"
              aria-label="Markdown 格式工具栏"
              data-i18n-aria-label="formatToolbar"
            >
              <button
                type="button"
                data-action="bold"
                aria-label="粗体"
                data-i18n-aria-label="bold"
                data-tooltip="粗体 ⌘B"
                data-i18n-tooltip="boldShortcut"
              >
                <i data-lucide="bold" aria-hidden="true"></i>
              </button>
              <button
                type="button"
                data-action="italic"
                aria-label="斜体"
                data-i18n-aria-label="italic"
                data-tooltip="斜体 ⌘I"
                data-i18n-tooltip="italicShortcut"
              >
                <i data-lucide="italic" aria-hidden="true"></i>
              </button>
              <button
                type="button"
                data-action="link"
                aria-label="链接"
                data-i18n-aria-label="link"
                data-tooltip="链接 ⌘K"
                data-i18n-tooltip="linkShortcut"
              >
                <i data-lucide="link-2" aria-hidden="true"></i>
              </button>
              <button
                type="button"
                data-action="code"
                aria-label="行内代码"
                data-i18n-aria-label="inlineCode"
                data-tooltip="行内代码"
                data-i18n-tooltip="inlineCode"
              >
                <i data-lucide="code-2" aria-hidden="true"></i>
              </button>
              <button
                type="button"
                data-action="codeblock"
                aria-label="代码块"
                data-i18n-aria-label="codeBlock"
                data-tooltip="代码块"
                data-i18n-tooltip="codeBlock"
              >
                <i data-lucide="square-code" aria-hidden="true"></i>
              </button>
              <button
                type="button"
                data-action="bullet"
                aria-label="无序列表"
                data-i18n-aria-label="bulletList"
                data-tooltip="无序列表"
                data-i18n-tooltip="bulletList"
              >
                <i data-lucide="list" aria-hidden="true"></i>
              </button>
              <button
                type="button"
                data-action="ordered"
                aria-label="有序列表"
                data-i18n-aria-label="orderedList"
                data-tooltip="有序列表"
                data-i18n-tooltip="orderedList"
              >
                <i data-lucide="list-ordered" aria-hidden="true"></i>
              </button>
              <button
                type="button"
                data-action="quote"
                aria-label="引用"
                data-i18n-aria-label="quote"
                data-tooltip="引用（Shift 点击增加层级）"
                data-i18n-tooltip="quoteTooltip"
              >
                <i data-lucide="quote" aria-hidden="true"></i>
              </button>
              <button
                type="button"
                data-action="formula"
                aria-label="公式"
                data-i18n-aria-label="formula"
                data-tooltip="LaTeX 公式"
                data-i18n-tooltip="latexFormula"
              >
                <i data-lucide="sigma" aria-hidden="true"></i>
              </button>
              <button
                type="button"
                data-action="image"
                aria-label="图片"
                data-i18n-aria-label="image"
                data-tooltip="图片"
                data-i18n-tooltip="image"
              >
                <i data-lucide="image" aria-hidden="true"></i>
              </button>
              <span class="toolbar-divider" aria-hidden="true"></span>
              <div class="more-actions">
                <button
                  id="more-button"
                  type="button"
                  aria-label="更多操作"
                  data-i18n-aria-label="moreActions"
                  aria-expanded="false"
                  aria-controls="more-menu"
                  data-tooltip="更多"
                  data-i18n-tooltip="more"
                >
                  <i data-lucide="more-horizontal" aria-hidden="true"></i>
                </button>
                <div class="more-menu" id="more-menu" hidden>
                  <button id="copy-markdown" type="button">
                    <i data-lucide="copy" aria-hidden="true"></i>
                    <span data-i18n="copyMarkdown">复制 Markdown</span>
                  </button>
                  <button id="download-markdown" type="button">
                    <i data-lucide="download" aria-hidden="true"></i>
                    <span data-i18n="downloadMarkdown">下载 .md</span>
                  </button>
                </div>
              </div>
            </div>
          </div>
          <div class="editor-body">
            <div class="line-numbers" id="line-numbers" aria-hidden="true">
              <div class="line-numbers-inner" id="line-numbers-inner"></div>
            </div>
            <div class="editor-input">
              <pre
                class="editor-diagnostics-overlay"
                id="editor-diagnostics-overlay"
                aria-hidden="true"
              ><code id="editor-diagnostics-content"></code></pre>
              <textarea
                id="editor"
                aria-label="Markdown 文本编辑器"
                data-i18n-aria-label="markdownEditor"
                spellcheck="false"
              ></textarea>
            </div>
          </div>
          <section
            class="diagnostics-panel"
            id="diagnostics-panel"
            aria-label="格式检查结果"
            data-i18n-aria-label="diagnosticResults"
            hidden
          >
            <div class="diagnostics-header">
              <div>
                <strong data-i18n="formatCheck">格式检查</strong>
                <span id="diagnostics-summary"></span>
              </div>
              <button
                id="diagnostics-close"
                type="button"
                aria-label="关闭格式检查面板"
                data-i18n-aria-label="closeDiagnostics"
              >
                &times;
              </button>
            </div>
            <ol class="diagnostics-list" id="diagnostics-list"></ol>
          </section>
          <footer class="pane-status">
            <span id="cursor-position">Ln 1, Col 1</span>
            <span class="status-separator" aria-hidden="true">·</span>
            <button
              class="format-status"
              id="format-status"
              type="button"
              aria-expanded="false"
              aria-controls="diagnostics-panel"
            >
              <span class="format-status-dot" aria-hidden="true"></span>
              <span id="format-summary">格式正常</span>
            </button>
            <span class="status-spacer"></span>
            <span data-i18n="spaces">空格：2</span>
            <span class="status-separator" aria-hidden="true">·</span>
            <span>UTF-8</span>
            <span class="status-separator" aria-hidden="true">·</span>
            <span>Markdown</span>
          </footer>
        </section>

        <div
          class="resizer"
          id="resizer"
          role="separator"
          aria-label="拖动调整编辑区和预览区宽度"
          data-i18n-aria-label="resizePanes"
          aria-orientation="vertical"
        >
          <span aria-hidden="true"></span>
        </div>

        <section
          class="pane preview-pane"
          aria-label="Markdown 预览区"
          data-i18n-aria-label="previewArea"
        >
          <div class="pane-header preview-header">
            <div class="pane-title">
              <i data-lucide="eye" aria-hidden="true"></i>
              <span data-i18n="preview">预览</span>
            </div>
            <span class="live-label"
              ><span aria-hidden="true"></span
              ><span data-i18n="livePreview">实时渲染</span></span
            >
          </div>
          <article class="preview-content" id="preview"></article>
          <footer class="pane-status preview-status">
            <span id="word-count">0 字</span>
            <span class="status-separator" aria-hidden="true">·</span>
            <span id="read-time">约 1 分钟阅读</span>
          </footer>
        </section>
      </main>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <div
      class="diagnostic-hover-card"
      id="diagnostic-hover-card"
      role="tooltip"
      aria-hidden="true"
      hidden
    ></div>
    <script type="module" src="/index.js"></script>
  </body>
</html>
